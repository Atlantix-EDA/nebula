[package]
name = "nebula"
version = "0.1.0"
edition = "2021"
authors = ["James Bonanno <james@atlantixeng.com>"]
description = "A template-driven FPGA build tool for generating Vivado TCL scripts"
repository = "https://github.com/saturn77/nebula"
license = "MIT OR Apache-2.0"
keywords = ["fpga", "vivado", "tcl", "build-tool", "xilinx"]
categories = ["command-line-utilities", "development-tools", "embedded"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
tera = "1.19"
colored = "3.0.0"

[[bin]]
name = "nebula"
path = "src/main.rs"
